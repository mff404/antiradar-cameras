name: Auto-Update Russia Speedcams

on:
  schedule:
    # Запуск каждое воскресенье в 03:00 UTC (06:00 по Москве)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Кнопка ручного запуска в один клик

permissions:
  contents: write

jobs:
  update-cameras:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile and update speedcams
        run: node update.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cameras_russia_live.json.gz README.md status.json
          git diff --staged --quiet || (git commit -m "Auto-update speedcams [skip ci]" && git push)
